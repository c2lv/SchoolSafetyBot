  <!-- main.py -->
  <rect x="72" y="342" width="120" height="78" rx="8" fill="url(#serverGrad)" filter="url(#shadow)"/>
  <text x="132" y="363" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">main.py</text>
  <text x="132" y="380" text-anchor="middle" font-size="9" fill="#bfdbfe">라우터 · 응답 빌더</text>
  <text x="132" y="394" text-anchor="middle" font-size="9" fill="#bfdbfe">콜백 처리</text>
