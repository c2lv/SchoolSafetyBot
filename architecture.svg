  <rect x="616" y="406" width="186" height="40" rx="8" fill="#1e2d1e" stroke="#10b981" stroke-width="1"/>
  <text x="709" y="422" text-anchor="middle" font-size="10" font-weight="600" fill="#34d399">openpyxl</text>
  <text x="709" y="437" text-anchor="middle" font-size="8.5" fill="#6ee7b7">엑셀 메뉴 파싱</text>

  <rect x="616" y="456" width="86" height="40" rx="8" fill="#1e2535" stroke="#3b82f6" stroke-width="1"/>
  <text x="659" y="472" text-anchor="middle" font-size="10" font-weight="600" fill="#60a5fa">requests</text>
  <text x="659" y="487" text-anchor="middle" font-size="8.5" fill="#93c5fd">HTTP 세션</text>

  <rect x="712" y="456" width="90" height="40" rx="8" fill="#1e2535" stroke="#7c3aed" stroke-width="1"/>
  <text x="757" y="472" text-anchor="middle" font-size="9.5" font-weight="600" fill="#a78bfa">Railway</text>
