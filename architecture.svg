  <line x1="192" y1="382" x2="206" y2="382" stroke="#10b981" stroke-width="1.3" marker-end="url(#arrowGreen)"/>
  <line x1="192" y1="392" x2="342" y2="392" stroke="#10b981" stroke-width="1.3" marker-end="url(#arrowGreen)"/>
  <line x1="478" y1="382" x2="466" y2="382" stroke="#f59e0b" stroke-width="1.3" marker-end="url(#arrowYellow)"/>

  <!-- 범례 -->
  <rect x="56" y="552" width="748" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="80" cy="563" r="4" fill="#FEE500"/>
  <text x="90" y="567" font-size="8.5" fill="#94a3b8">카카오 플랫폼</text>
  <circle cx="170" cy="563" r="4" fill="#3b82f6"/>
