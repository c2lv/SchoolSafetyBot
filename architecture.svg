  <line x1="160" y1="284" x2="200" y2="310" stroke="#60a5fa" stroke-width="1.8" marker-end="url(#arrowBlue)" stroke-dasharray="5,3"/>
  <text x="145" y="302" font-size="8" fill="#60a5fa">POST /skill</text>

  <line x1="180" y1="316" x2="170" y2="288" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowGreen)" stroke-dasharray="5,3"/>
