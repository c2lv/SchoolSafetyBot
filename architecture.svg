  <line x1="60" y1="52" x2="800" y2="52" stroke="#334155" stroke-width="1"/>

  <text x="24" y="115" font-size="9.5" fill="#64748b" font-weight="600" letter-spacing="1.5" transform="rotate(-90,24,115)" text-anchor="middle">USER</text>
  <text x="24" y="255" font-size="9.5" fill="#64748b" font-weight="600" letter-spacing="1.5" transform="rotate(-90,24,255)" text-anchor="middle">PLATFORM</text>
  <text x="24" y="395" font-size="9.5" fill="#64748b" font-weight="600" letter-spacing="1.5" transform="rotate(-90,24,395)" text-anchor="middle">SERVER</text>
  <text x="24" y="520" font-size="9.5" fill="#64748b" font-weight="600" letter-spacing="1.5" transform="rotate(-90,24,520)" text-anchor="middle">DATA / EXT</text>

