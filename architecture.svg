  <text x="130" y="97" text-anchor="middle" font-size="22">💬</text>
  <text x="130" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">카카오톡</text>
  <text x="130" y="130" text-anchor="middle" font-size="9.5" fill="#3d3000">사용자 채팅 인터페이스</text>

