  <circle cx="240" cy="563" r="4" fill="#10b981"/>
  <text x="250" y="567" font-size="8.5" fill="#94a3b8">데이터 / 파싱</text>
  <circle cx="325" cy="563" r="4" fill="#f59e0b"/>
  <text x="335" y="567" font-size="8.5" fill="#94a3b8">외부 시스템 (nDRIMS)</text>
  <circle cx="445" cy="563" r="4" fill="#8b5cf6"/>
  <text x="455" y="567" font-size="8.5" fill="#94a3b8">개발 도구 / 배포</text>
  <line x1="530" y1="563" x2="548" y2="563" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="555" y="567" font-size="8.5" fill="#94a3b8">API 호출</text>
  <line x1="620" y1="563" x2="638" y2="563" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="645" y="567" font-size="8.5" fill="#94a3b8">데이터 흐름</text>
