  <rect x="76" y="195" width="168" height="22" rx="6" fill="#0f2035"/>
  <text x="160" y="211" text-anchor="middle" font-size="10" fill="#94a3b8">🗂 시나리오 · 블록 구성</text>
  <rect x="76" y="222" width="80" height="20" rx="5" fill="#0f2035"/>
